      pérdida de credenciales + afirmación falsa de rotación.
    evidence: "lectura de código en el baseline; ver findings-matrix.tsv F01"
    dispositionRequired: "Deshabilitar la escritura en pass-audit ANTES de cualquier otra tarea (P01-O01)."

    what: "F01 — pérdida destructiva de credenciales"
    detail: >
      src/agent/executor.ts:152-159 itera report.rotationPlan y llama
      passClient.generate(path) para CADA entrada débil/duplicada/stale cuando
      AGENT_DRY_RUN=false. src/pass.ts generate() ejecuta

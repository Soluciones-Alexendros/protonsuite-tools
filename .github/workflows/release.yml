name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.releaserc.json'
      - 'docs/publishing.md'
      - 'RELEASE.md'
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Simular release sin publicar nada"
        type: boolean
        default: false
      bootstrap-npm:
        description: "Publicar la versión actual de package.json a npm (rescate; no crea tag)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.ref) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: latest
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # No pnpm cache on release path: supply-chain posture (docs/publishing.md)
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    env:
      # Secret de organización (visibilidad del repo). Preferible a largo plazo: Trusted Publisher OIDC.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    outputs:
      published: ${{ steps.meta.outputs.published }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: latest
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm ≥ 11.5.1 también sirve para OIDC si se reactiva Trusted Publisher.
      # Pin por commit (Scorecard/zizmor): corepack no sustituye el npm del
      # runtime Node 22; git+https#sha40 sí cuenta como dependencia pinneada.
      - name: Ensure npm CLI (≥11.5.1)
        run: |
          set -euo pipefail
          # npm/cli@v11.5.1 → da1d4d299151781500ec854f10eb7e570696d506
          npm install -g 'git+https://github.com/npm/cli.git#da1d4d299151781500ec854f10eb7e570696d506'
          VER="$(npm --version)"
          echo "npm=${VER}"
          node -e "const [maj,min,pat]='$VER'.split('.').map(Number); if(!(maj>11||(maj===11&&(min>5||(min===5&&pat>=1))))){console.error('need npm>=11.5.1, got', '$VER'); process.exit(1)}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: npm registry status
        id: npmstatus
        run: |
          set -euo pipefail
          if npm view @alexendros/protonsuite-agent version >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Paquete presente en npm ($(npm view @alexendros/protonsuite-agent version))."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=npm registry::Paquete ausente; bootstrap-npm o primer publish con NPM_TOKEN. Ver docs/publishing.md."
          fi
      - name: Semantic Release
        id: semrel
        if: ${{ github.event.inputs.bootstrap-npm != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          BEFORE="$(node -p "require('./package.json').version")"
          echo "before=${BEFORE}" >> "$GITHUB_OUTPUT"
          DRY_RUN="${{ github.event_name == 'pull_request' || github.event.inputs.dry-run == 'true' }}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "semantic-release --dry-run (PR o workflow_dispatch)"
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi
          AFTER="$(node -p "require('./package.json').version")"
          echo "after=${AFTER}" >> "$GITHUB_OUTPUT"
      - name: Bootstrap npm publish (versión actual)
        id: bootstrap
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bootstrap-npm == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "Publicando @alexendros/protonsuite-agent@${VERSION} (NPM_TOKEN org / OIDC si aplica)…"
          # semantic-release no republica un tag ya cortado; este camino es solo bootstrap/rescate.
          npm publish --access public
          echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
      - name: Export release metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          BEFORE="${{ steps.semrel.outputs.before }}"
          AFTER="${{ steps.semrel.outputs.after }}"
          if [ "${{ steps.bootstrap.outputs.bootstrapped }}" = "true" ]; then
            # Bootstrap no corta tag nuevo; no dispares GHCR otra vez.
            echo "published=false" >> "$GITHUB_OUTPUT"
          elif [ -n "${BEFORE}" ] && [ "${BEFORE}" != "${AFTER}" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  publish-ghcr:
    name: Build & push to GHCR
    needs: release
    if: >-
      github.event_name == 'push'
      && needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: v${{ needs.release.outputs.version }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
      - name: Build & push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

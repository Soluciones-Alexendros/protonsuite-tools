name: Integration Tests

on:
  schedule:
    - cron: '0 6 * * *'
  pull_request:
    paths:
      - '.github/workflows/integration.yml'
      - 'tests/integration/**'
      - 'vitest.integration.config.ts'
      - 'src/ecosystem/**'
  workflow_dispatch:
    inputs:
      bridge-real:
        description: "Run against real Proton Bridge (requires bridge-test secrets)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  integration:
    name: Integration (hosted skip-live / Bridge on demand)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.repository_owner == 'Soluciones-Alexendros'
    environment: ${{ github.event.inputs.bridge-real == 'true' && 'bridge-test' || '' }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project

      - run: pnpm run build

      - name: Preflight live services
        id: preflight
        env:
          BRIDGE_REAL: ${{ github.event.inputs.bridge-real }}
          # secrets.* vacío se evalúa como cadena vacía; no inventar credenciales
          BRIDGE_USER: ${{ secrets.PROTON_BRIDGE_USER }}
          BRIDGE_PASS: ${{ secrets.PROTON_BRIDGE_PASS }}
        run: |
          set -euo pipefail
          if [ "${BRIDGE_REAL:-}" = "true" ]; then
            if [ -z "${BRIDGE_USER}" ] || [ -z "${BRIDGE_PASS}" ]; then
              echo "::error::bridge-real=true requiere PROTON_BRIDGE_USER y PROTON_BRIDGE_PASS en el environment 'bridge-test'."
              exit 1
            fi
            echo "mode=real" >> "$GITHUB_OUTPUT"
            echo "Modo Bridge real (environment bridge-test)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=hosted" >> "$GITHUB_OUTPUT"
            {
              echo "### Integration (hosted)"
              echo ""
              echo "Runner GitHub-hosted: no hay Proton Bridge, \`pass\` ni \`proton-drive\`."
              echo "Los smokes de Bridge/Pass/Drive se saltan. Suite-health sí corre."
              echo "Para Bridge real: \`workflow_dispatch\` + \`bridge-real=true\` (environment \`bridge-test\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Integration tests (hosted — skip live)
        if: steps.preflight.outputs.mode == 'hosted'
        run: pnpm run test:integration
        env:
          PROTON_INTEGRATION_TEST: 'true'
          # Sin credenciales Bridge: integrationTest() hace skip (spec IT-02 / SI05)
          ALERTS_ENABLED: 'false'

      - name: Integration tests (real Bridge)
        if: steps.preflight.outputs.mode == 'real'
        run: pnpm run test:integration
        env:
          PROTON_INTEGRATION_TEST: 'true'
          PROTON_BRIDGE_USER: ${{ secrets.PROTON_BRIDGE_USER }}
          PROTON_BRIDGE_PASS: ${{ secrets.PROTON_BRIDGE_PASS }}
          PROTON_MAIL_FROM: ${{ secrets.PROTON_MAIL_FROM }}
          PROTON_BRIDGE_HOST: ${{ secrets.PROTON_BRIDGE_HOST || '127.0.0.1' }}
          PROTON_BRIDGE_IMAP_PORT: ${{ secrets.PROTON_BRIDGE_IMAP_PORT || '1143' }}
          PROTON_BRIDGE_SMTP_PORT: ${{ secrets.PROTON_BRIDGE_SMTP_PORT || '1025' }}
          PROTON_BRIDGE_TLS_INSECURE: 'true'
          ALERTS_ENABLED: 'false'
          ALERT_NTFY_TOPIC: ${{ secrets.ALERT_NTFY_TOPIC }}
          ALERT_NTFY_URL: ${{ secrets.ALERT_NTFY_URL }}
          ALERT_NTFY_TOKEN: ${{ secrets.ALERT_NTFY_TOKEN }}
